name: ci

on:
  push:
    branches:
      # Default branch is `main`; `master` is listed too so this still
      # works if the repo is renamed or aligned with sibling repos.
      # PRs already trigger via `pull_request:`.
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - run: npm run lint

      - run: npm run build

      - run: npm test

      - run: npm run test:e2e
